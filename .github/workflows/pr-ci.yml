name: PR CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight; Chromium downloads are the expensive part.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts skips playwright's postinstall so the browser download is a
      # separate, cacheable step rather than an uncacheable side effect of npm ci.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser but not the OS packages it links against.
      - name: Install Chromium system dependencies
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The browser tests skip themselves when Chromium is missing, so a suite that
      # skipped everything would pass silently and prove nothing. Fail on any skip.
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee result.txt
          if grep -qE 'skipped [1-9]' result.txt; then
            echo "::error::tests were skipped; Chromium did not install"
            exit 1
          fi
